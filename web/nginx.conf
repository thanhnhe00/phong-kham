# Web nhân viên + cổng vào API cho người dùng (app bệnh nhân cũng có thể gọi qua đây).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # tệp kết quả xét nghiệm tối đa 10 MB (khớp spring.servlet.multipart)
    client_max_body_size 11m;

    # Số liệu giám sát chỉ cho Prometheus đọc trong mạng Docker, không mở ra ngoài
    location /api/actuator/ {
        return 404;
    }
    location = /api/actuator/health {
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # backend lấy IP thật của người dùng từ đây để chống spam theo IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tệp đã băm tên (Vite) cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ứng dụng một trang: đường dẫn nào cũng trả index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
