# Cả hệ thống: database, backend, web nhân viên (nginx), giám sát (Prometheus + Grafana).
#   Lần đầu / khi dev:  cp .env.example .env && docker compose up -d --build
#   CD (GitHub Actions): kéo image đã build sẵn từ ghcr.io theo IMAGE_TAG rồi `up -d --no-build` (xem docs/trien-khai.md)
# Địa chỉ trên máy: web http://localhost:8088 · API http://localhost:8080/api · Grafana http://localhost:3005 · Prometheus http://localhost:9095
name: he-thong-phong-kham

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # mở để backend chạy ngoài Docker (mvnw spring-boot:run) kết nối được khi dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER:-thanhnhe00}/phong-kham-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMS_VERIFY_NUMBER: ${SMS_VERIFY_NUMBER:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_SIGNING_KEY: ${SMS_GATEWAY_SIGNING_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      CLINIC_CODE: ${CLINIC_CODE:-PK001}
      STORAGE_DIR: /app/data/files
    ports:
      - "8080:8080" # app bệnh nhân (Expo) và kiểm thử gọi thẳng API
    volumes:
      - files:/app/data # tệp kết quả xét nghiệm, ảnh chụp
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  web:
    image: ghcr.io/${GHCR_OWNER:-thanhnhe00}/phong-kham-web:${IMAGE_TAG:-latest}
    build: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    secrets:
      - metrics_token
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/phong-kham.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3005}:3000"

# Token để Prometheus đọc số liệu backend, lấy từ biến METRICS_TOKEN trong .env
secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  pgdata:
  files:
  promdata:
  grafanadata:
