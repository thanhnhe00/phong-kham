spring.application.name=backend
server.port=${PORT:8080}
# Mọi API nằm dưới /api (Caddy chuyển /api sang backend, phần còn lại là web)
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/phongkham}
spring.datasource.username=${DB_USER:phongkham}
spring.datasource.password=${DB_PASSWORD:phongkham}

# Schema do Flyway quản lý (src/main/resources/db/migration); Hibernate chỉ kiểm tra entity khớp, không tự sửa bảng
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health

# Swagger UI: /api/docs
springdoc.swagger-ui.path=/docs

# Bảo mật: JWT_SECRET bắt buộc (>= 32 ký tự)
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=${JWT_TTL:12h}
app.auth.max-failed-logins=5
app.auth.lock-duration=15m

# Lịch: yêu cầu đổi ca gửi trước giờ khám tối thiểu
app.schedule.change-min-notice=24h
# Lịch hẹn: gọi không được tối đa 3 lần thì giữ chờ; quá giờ hẹn 15 phút chưa check-in = không đến;
# không đến 3 lần trong 30 ngày thì tạm khóa đặt qua app (vẫn đặt qua lễ tân được)
app.booking.max-contact-attempts=3
app.booking.no-show-after=15m
app.booking.no-show-limit=3
app.booking.no-show-window=30d
# Tác vụ nền (đánh dấu không đến khám mỗi phút)
app.jobs.enabled=true

# Hàng đợi: cứ 3 lượt người đặt lịch thì xen 1 người vãng lai (0 = vãng lai sau cùng)
app.queue.walk-in-every=3

# Tệp kết quả (ảnh, PDF) lưu trên ổ đĩa
app.storage.dir=${STORAGE_DIR:./data/files}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Mã cơ sở khám bệnh (5 ký tự), đứng đầu mã đơn thuốc
app.clinic.code=${CLINIC_CODE:PK001}

# Xác minh số điện thoại: người dùng NHẮN "PKXM <mã>" từ chính SIM của họ tới số của phòng khám (phòng khám không tốn
# tiền SMS). Một điện thoại làm cổng SMS chuyển tin về POST /api/sms/inbound. Xem README "Xác minh số điện thoại".
# Số SIM của máy cổng (bệnh nhân nhắn tới số này)
app.sms.verify-number=${SMS_VERIFY_NUMBER:}
# iPhone Phím tắt / cổng khác: chuỗi bí mật gửi trong header X-Gateway-Token
app.sms.gateway-token=${SMS_GATEWAY_TOKEN:}
# Android "SMS Gateway": Settings -> Webhooks -> Signing Key (chữ ký HMAC-SHA256)
app.sms.signing-key=${SMS_GATEWAY_SIGNING_KEY:}

# Chống spam theo IP (xin mã, đăng ký, đăng nhập, đặt lại mật khẩu, đặt lịch). Chỉ tắt khi chạy kiểm thử
# tự động / đo hiệu năng từ một máy.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Sau Caddy/nginx: lấy IP thật của người dùng từ X-Forwarded-For, chỉ tin header này khi đến từ proxy mạng nội bộ
server.forward-headers-strategy=native
# true = tạo dữ liệu demo khi DB chưa có tài khoản nào
app.seed-demo=${SEED_DEMO:false}
