# Luật cảnh báo. Xem trạng thái ở Prometheus (tab Alerts) hoặc Grafana (Alerting → Alert rules).
groups:
  - name: phong-kham
    rules:
      - alert: BackendKhongPhanHoi
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Backend không phản hồi quá 1 phút"
          description: "Prometheus không lấy được số liệu từ backend. Kiểm tra: docker compose ps, docker compose logs backend."

      - alert: TyLeLoiMayChuCao
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{job="backend"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Hơn 5% yêu cầu bị lỗi máy chủ (5xx) trong 5 phút"

      - alert: PhanHoiCham
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="backend",uri!~"/actuator.*"}[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "95% yêu cầu mất hơn 1 giây"

      - alert: NghiSpam
        expr: sum(increase(http_server_requests_seconds_count{job="backend",status="429"}[5m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Hơn 20 yêu cầu bị chặn vì thao tác quá nhiều trong 5 phút (có thể đang bị spam)"

      - alert: HetKetNoiCSDL
        expr: max(hikaricp_connections_pending{job="backend"}) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Có yêu cầu phải chờ kết nối cơ sở dữ liệu quá 2 phút"

      - alert: BoNhoJvmGanDay
        expr: |
          sum(jvm_memory_used_bytes{job="backend",area="heap"}) / sum(jvm_memory_max_bytes{job="backend",area="heap"} > 0) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Bộ nhớ heap của backend dùng trên 90%"
